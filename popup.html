<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Exporter</title>
  <style>
    :root {
      --bg: #17212b; --surface: #232e3c; --text: #e8eaed;
      --text-muted: #8a9aaa; --accent: #5288c1; --accent-hover: #4a7bb5;
      --success: #4caf80; --error: #e57373; --radius: 8px; --radius-sm: 4px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; background: var(--bg); color: var(--text);
      width: 340px; min-height: 460px; padding: 16px;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo svg { width: 20px; height: 20px; fill: white; }
    h1 { font-size: 15px; font-weight: 600; line-height: 1.2; }
    h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); margin-top: 2px; }
    .status-bar { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 14px; font-size: 12px; color: var(--text-muted); min-height: 36px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    .dot.active { background: var(--success); }
    .dot.error { background: var(--error); }
    .controls { display: grid; gap: 8px; margin-bottom: 14px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s, transform 0.1s; color: white; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-all { background: #2d6a4f; }
    .btn-all:hover { background: #1b4332; }
    .btn-success { background: #357a58; }
    .btn-success:hover { background: #2d6b4d; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-secondary:hover { background: rgba(255,255,255,0.13); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .format-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .format-btn { flex: 1; padding: 7px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .format-btn.active, .format-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(82,136,193,0.1); }
    .preview-box { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; max-height: 140px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; display: none; }
    .preview-box.visible { display: block; }
    .preview-box::-webkit-scrollbar { width: 4px; }
    .preview-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .hint { font-size: 10px; color: var(--text-muted); text-align: center; margin-bottom: 8px; opacity: 0.7; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-2.008 9.464c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L6.04 14.888l-2.93-.917c-.637-.2-.65-.637.136-.943l11.445-4.414c.53-.193.994.13.871.634z"/></svg>
  </div>
  <h1>Telegram Exporter<small>Copy &amp; export chat messages</small></h1>
</header>
<div class="status-bar" id="statusBar">
  <div class="dot" id="statusDot"></div>
  <span id="statusText">Open Telegram Web and select a chat</span>
</div>
<div class="format-row">
  <button class="format-btn active" data-format="txt">TXT</button>
  <button class="format-btn" data-format="json">JSON</button>
  <button class="format-btn" data-format="csv">CSV</button>
  <button class="format-btn" data-format="md">Markdown</button>
</div>
<div class="controls">
  <button class="btn btn-all" id="btnExtractAll">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg>
    Extract ALL (auto-scroll)
  </button>
  <button class="btn btn-primary" id="btnExtract">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Extract Visible Only
  </button>
  <button class="btn btn-secondary" id="btnCopy" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    Copy to Clipboard
  </button>
  <button class="btn btn-success" id="btnDownload" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download File
  </button>
</div>
<p class="hint">"Extract ALL" auto-scrolls the chat to collect every message</p>
<div class="preview-box" id="previewBox"></div>
<div class="footer-note" id="footerNote"></div>
<script src="popup.js"></script>
</body>
</html>
